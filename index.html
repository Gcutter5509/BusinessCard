<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="background">
        <div class="main--article">
            <img src="lain.jpg" alt="Profile Picture" class="pfp">
            <h1 class="text">Мои работы</h1>
            <div class="social--links">
                <div class="link--tile pinterest"><img src="pinterest.jpg" alt="Pinterest" class="pinterest--logo"></div>
                <div class="link--tile github"><img src="github.jpg" alt="GitHub" class="github--logo"></div>
                <div class="link--tile tiktok"><img src="tiktok.jpg" alt="TikTok" class="tiktok--logo"></div>
            </div>
        </div>
    </div>
</body>
</html>
