<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="background">
        <div class="main--article">
            <img src="lain.jpg" alt="Profile Picture" class="pfp">
            <h1 class="text">Мои работы</h1>
            <div class="social--links">
                <div class="link--tile pinterest"><img src="pinterest-3.svg" alt="Pinterest" class="logo pinterest--logo"><div class="name"></div></div>
                <div class="link--tile github"><img src="github-icon-2.svg" alt="GitHub" class="logo github--logo"><div class="name"></div></div>
                <div class="link--tile tiktok"><img src="tiktok-1.svg" alt="TikTok" class="logo tiktok--logo"><div class="name"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
